name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Sphinx docs + gallery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@v5

      - name: Install system packages for OCCT-backed examples
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1 libxft2 libxcursor-dev libxinerama1 \
            libocct-data-exchange-dev libocct-foundation-dev xvfb pandoc openscad

      - name: Install with [docs]
        run: uv sync --extra docs

      # The gallery executes every example, so it fetches the whole
      # `pyvista_cad.examples.downloads` registry on a cold runner. That
      # made the build hostage to the slowest upstream of the day: NIST
      # has served the multi-MB STEP fixtures slowly enough to blow the
      # HTTP read timeout and fail the job outright. Same cache strategy
      # the `test` jobs in ci.yml already use: the sha256-pinned registry
      # in downloads.py is a complete cache key.
      - name: Cache example datasets
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.pooch-cache/pyvista_cad
          key: pooch-${{ runner.os }}-${{ hashFiles('src/pyvista_cad/examples/downloads.py') }}
          restore-keys: |
            pooch-${{ runner.os }}-

      - name: Build documentation
        env:
          PYVISTA_CAD_USERDATA_PATH: ${{ github.workspace }}/.pooch-cache/pyvista_cad
        run: uv run make -C doc html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: doc/_build/html/
          retention-days: 7

  deploy:
    name: Deploy to Netlify
    needs: build
    # Fork PRs get no secrets, so they build the docs without a preview.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: html

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        with:
          publish-dir: html
          fails-without-credentials: true
          production-deploy: ${{ github.ref == 'refs/heads/main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions (${{ github.sha }})"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: false
          github-deployment-environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          github-deployment-description: "pyvista-cad docs"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10

      - name: Add deploy link to job summary
        env:
          DEPLOY_URL: ${{ steps.netlify.outputs.deploy-url }}
        run: echo "Docs deployed to $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

  doctest:
    name: Doctest
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: pyvista/setup-headless-display-action@v5
      - name: Install system packages for OCCT-backed examples
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1 libxft2 libxcursor-dev libxinerama1 \
            libocct-data-exchange-dev libocct-foundation-dev xvfb pandoc openscad
      - run: uv sync --extra docs
      - run: uv run make -C doc doctest
